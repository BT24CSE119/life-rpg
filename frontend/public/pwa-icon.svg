<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b160a"/>
      <stop offset="50%" stop-color="#0d101d"/>
      <stop offset="100%" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="50%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#d49b13"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f5c842" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded app icon frame -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Sword Emblem (RPG Icon) -->
  <g transform="translate(100, 100) scale(0.61)" filter="url(#glow)">
    <!-- Blade -->
    <path d="M256 40 L280 180 L256 400 L232 180 Z" fill="url(#gold)"/>
    <path d="M256 40 L280 180 L256 400 Z" fill="#ffe27a" opacity="0.7"/>
    <!-- Guard -->
    <rect x="156" y="380" width="200" height="32" rx="16" fill="url(#gold)"/>
    <circle cx="256" cy="396" r="14" fill="#0d101d" stroke="url(#gold)" stroke-width="4"/>
    <!-- Grip & Pommel -->
    <rect x="244" y="412" width="24" height="64" rx="6" fill="#f5c842"/>
    <circle cx="256" cy="492" r="22" fill="url(#gold)"/>
    <!-- Stars -->
    <polygon points="120,200 130,225 155,225 135,240 142,265 120,250 98,265 105,240 85,225 110,225" fill="#f5c842" opacity="0.6"/>
    <polygon points="392,200 402,225 427,225 407,240 414,265 392,250 370,265 377,240 357,225 382,225" fill="#f5c842" opacity="0.6"/>
  </g>
</svg>
